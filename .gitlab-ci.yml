stages:
  - test

variables:
  CI: "true"

playwright-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.55.0-jammy
  timeout: 1h

  before_script:
    - npm ci

  script:
    - npx playwright install --with-deps chromium
    - npm run test:ci

  artifacts:
    when: always
    name: playwright-artifacts
    paths:
      - playwright-report/
      - test-results/
      - reports/
    expire_in: 5 days
    reports:
      junit: reports/junit/results.xml

  rules:
    # Run from GitLab Pipeline Schedule
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

    # Run when manually triggered from GitLab UI
    - if: '$CI_PIPELINE_SOURCE == "web"'